name: PrecheckSwiftUIBroken
options:
  bundleIdPrefix: org.appstoreprecheck.corpus
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
targets:
  PrecheckSwiftUIBroken:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.appstoreprecheck.corpus.swiftui.broken
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
